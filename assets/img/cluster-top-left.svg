<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 480" aria-hidden="true">
  <defs><radialGradient id="gPink" cx="50%" cy="38%" r="72%"><stop offset="0%" stop-color="#F5D0DC"/><stop offset="55%" stop-color="#E9A9BC"/><stop offset="100%" stop-color="#D07E97"/></radialGradient><radialGradient id="gPale" cx="50%" cy="35%" r="75%"><stop offset="0%" stop-color="#F8E0E8"/><stop offset="60%" stop-color="#F0C3D0"/><stop offset="100%" stop-color="#DE9DB4"/></radialGradient><radialGradient id="gRose" cx="45%" cy="35%" r="75%"><stop offset="0%" stop-color="#D9718C"/><stop offset="100%" stop-color="#B44467"/></radialGradient><linearGradient id="gLeaf" x1="0" y1="0" x2="0.8" y2="1"><stop offset="0%" stop-color="#9CAC6E"/><stop offset="100%" stop-color="#79894C"/></linearGradient>
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <g id="orchid">
      <ellipse cx="0" cy="-16" rx="9" ry="17" fill="url(#gPink)" opacity="0.85" filter="url(#wc)"/>
      <ellipse cx="-14" cy="-2" rx="9" ry="17" fill="url(#gPink)" opacity="0.8" transform="rotate(-65)" filter="url(#wc)"/>
      <ellipse cx="14" cy="-2" rx="9" ry="17" fill="url(#gPink)" opacity="0.8" transform="rotate(65)" filter="url(#wc)"/>
      <ellipse cx="-8" cy="9" rx="8" ry="13" fill="url(#gPale)" opacity="0.85" transform="rotate(-30)" filter="url(#wc)"/>
      <ellipse cx="8" cy="9" rx="8" ry="13" fill="url(#gPale)" opacity="0.85" transform="rotate(30)" filter="url(#wc)"/>
      <path d="M0 2 C -5 8, -3 14, 0 16 C 3 14, 5 8, 0 2 Z" fill="url(#gRose)"/>
      <circle cx="0" cy="1" r="3.4" fill="#BE3D6B"/>
    </g>
    <g id="calla">
      <path d="M0 30 C -1 16, -2 6, 0 0" stroke="#8A9A5B" stroke-width="2.4" fill="none"/>
      <path d="M0 2 C -12 -6, -10 -24, 0 -30 C 6 -22, 10 -8, 3 3 Z" fill="url(#gRose)" opacity="0.85" filter="url(#wc)"/>
      <path d="M0 0 C -6 -8, -5 -18, 0 -24" stroke="#BE3D6B" stroke-width="1.6" fill="none" opacity="0.7"/>
    </g>
    <g id="anthurium">
      <path d="M0 -22 C 16 -18, 18 4, 4 18 C 0 22, -4 20, -6 14 C -16 2, -12 -18, 0 -22 Z" fill="url(#gPale)" opacity="0.75" filter="url(#wc)"/>
      <path d="M0 -22 C 16 -18, 18 4, 4 18" stroke="#E9A9BC" stroke-width="1.2" fill="none"/>
      <path d="M-1 -18 L 1 8" stroke="#C75B77" stroke-width="2.6" stroke-linecap="round"/>
    </g>
    <g id="amaranthus">
      <path d="M0 0 C 2 24, -2 46, 1 70" stroke="#8A9A5B" stroke-width="1.6" fill="none"/>
      <g fill="url(#gLeaf)" opacity="0.75">
        <circle cx="-2" cy="8" r="2.6"/><circle cx="3" cy="14" r="2.6"/><circle cx="-1" cy="21" r="2.6"/>
        <circle cx="2" cy="28" r="2.4"/><circle cx="-2" cy="35" r="2.4"/><circle cx="2" cy="42" r="2.2"/>
        <circle cx="-1" cy="49" r="2.2"/><circle cx="1" cy="56" r="2"/><circle cx="0" cy="63" r="1.8"/>
      </g>
    </g>
    <g id="blossom">
      <g fill="url(#gPink)" opacity="0.9">
        <ellipse cx="0" cy="-4" rx="2.6" ry="4"/>
        <ellipse cx="-4" cy="1" rx="2.6" ry="4" transform="rotate(-70)"/>
        <ellipse cx="4" cy="1" rx="2.6" ry="4" transform="rotate(70)"/>
        <ellipse cx="-2.5" cy="4" rx="2.6" ry="4" transform="rotate(-140)"/>
        <ellipse cx="2.5" cy="4" rx="2.6" ry="4" transform="rotate(140)"/>
      </g>
      <circle r="1.6" fill="url(#gRose)"/>
    </g>
    <g id="leaf">
      <path d="M0 0 C 8 -4, 16 -2, 20 6 C 12 10, 4 8, 0 0 Z" fill="url(#gLeaf)" opacity="0.8" filter="url(#wc)"/>
    </g>
    <g id="sprig">
      <path d="M0 0 C 4 -14, 2 -28, 6 -40" stroke="#8A9A5B" stroke-width="1.2" fill="none"/>
      <use href="#leaf" transform="translate(2 -12) scale(0.5)"/>
      <use href="#leaf" transform="translate(3 -24) scale(0.45) rotate(-30)"/>
      <use href="#leaf" transform="translate(5 -34) scale(0.4) rotate(20)"/>
    </g>
  </defs>

  <!-- fanning foliage anchoring the corner, laid down first so flowers sit on top -->
  <use href="#sprig" transform="translate(18 30) rotate(35) scale(1.1)"/>
  <use href="#sprig" transform="translate(30 300) rotate(160) scale(1.2)"/>
  <use href="#sprig" transform="translate(100 415) rotate(105) scale(1)"/>

  <!-- hanging amaranthus tucked behind the main blooms, kept clear of the names column -->
  <use href="#amaranthus" transform="translate(65 255) scale(1.3)"/>
  <use href="#amaranthus" transform="translate(100 300) scale(1.05) rotate(6)"/>

  <!-- anthurium anchoring the top -->
  <use href="#anthurium" transform="translate(140 40) scale(1.5) rotate(-10)"/>

  <!-- callas -->
  <use href="#calla" transform="translate(240 140) scale(1.4) rotate(35)"/>
  <use href="#calla" transform="translate(200 220) scale(1.1) rotate(60)"/>

  <!-- orchids, the focal blooms -->
  <use href="#orchid" transform="translate(90 120) scale(1.6)"/>
  <use href="#orchid" transform="translate(170 80) scale(1.2) rotate(20)"/>
  <use href="#orchid" transform="translate(60 220) scale(1.1) rotate(-15)"/>

  <!-- blossom spray drifting toward the open page -->
  <use href="#blossom" transform="translate(260 60) scale(0.9)"/>
  <use href="#blossom" transform="translate(288 78) scale(1.2)"/>
  <use href="#blossom" transform="translate(308 98) scale(0.8)"/>
  <use href="#blossom" transform="translate(322 122) scale(1.0)"/>
</svg>
