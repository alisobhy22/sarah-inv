  <!--
    The wax seal, not the mark on its own. At 16px a fine rose serif on cream
    collapses into mud; a saturated disc survives any size, and it is the mark
    the guest just broke to get in. Colours are the resolved values of the
    page tokens, since an icon cannot reach a stylesheet.

    The impression is the same path the page uses, baked in here rather than
    referenced: a favicon is fetched on its own and can borrow nothing.
  -->
